# Runs the demo in a container:   docker compose run --rm pipelineforge
# Everything below `airflow` is UNTESTED (the DAG itself was checked with `airflow dags test`
# on a Linux machine, but this container setup was not run).
services:
  pipelineforge:
    build: .
    volumes: ["./data:/app/data"]

  airflow:
    profiles: ["airflow"]
    image: apache/airflow:3.3.2
    command: standalone
    ports: ["8081:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas"
      PYTHONPATH: /opt/airflow/project
      PF_OLTP: /opt/airflow/project/data/oltp.db
      PF_WAREHOUSE: /opt/airflow/project/data/warehouse.db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipelineforge:/opt/airflow/project/pipelineforge
      - ./data:/opt/airflow/project/data
